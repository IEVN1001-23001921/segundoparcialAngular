<div class="max-w-5xl mx-auto my-10 p-6 bg-white border border-gray-300 shadow-md rounded-lg">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 divide-y md:divide-y-0 md:divide-x divide-gray-400">

    <!-- FORMULARIO -->
    <div class="pr-0 md:pr-6">

      <form [formGroup]="formulario" (ngSubmit)="muestraZodiaco()" class="space-y-4">

        <h2 class="text-center font-bold text-gray-800 text-lg mb-2">
          Datos Personales
        </h2>

        <!-- Nombre -->
        <div class="flex items-center gap-2">
          <label class="w-24 text-sm font-semibold text-gray-700">
            Nombre
          </label>

          <input
            type="text"
            formControlName="nombre"
            placeholder="Nombre"
            class="bg-gray-50 border border-gray-400 text-gray-900 text-sm rounded-lg block w-full p-2">
        </div>

        <!-- Apellido paterno -->
        <div class="flex items-center gap-2">
          <label class="w-24 text-sm font-semibold text-gray-700">
            Apaterno
          </label>

          <input
            type="text"
            formControlName="Apaterno"
            placeholder="Apaterno"
            class="bg-gray-50 border border-gray-400 text-gray-900 text-sm rounded-lg block w-full p-2">
        </div>

        <!-- Apellido materno -->
        <div class="flex items-center gap-2">
          <label class="w-24 text-sm font-semibold text-gray-700">
            Amaterno
          </label>

          <input
            type="text"
            formControlName="Amaterno"
            placeholder="Amaterno"
            class="bg-gray-50 border border-gray-400 text-gray-900 text-sm rounded-lg block w-full p-2">
        </div>

        <!-- Fecha de nacimiento -->
        <div class="pt-2">

          <p class="text-center font-semibold text-gray-800 text-sm mb-1">
            Fecha de nacimiento
          </p>

          <div class="grid grid-cols-3 gap-3 text-center">

            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">
                Día
              </label>

              <input
                type="number"
                formControlName="dia"
                min="1"
                max="31"
                class="bg-gray-50 border border-gray-400 text-gray-900 text-sm rounded-lg block w-full p-2 text-center">
            </div>

            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">
                Mes
              </label>

              <input
                type="number"
                formControlName="mes"
                min="1"
                max="12"
                class="bg-gray-50 border border-gray-400 text-gray-900 text-sm rounded-lg block w-full p-2 text-center">
            </div>

            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">
                Año
              </label>

              <input
                type="number"
                formControlName="anio"
                min="1"
                class="bg-gray-50 border border-gray-400 text-gray-900 text-sm rounded-lg block w-full p-2 text-center">
            </div>

          </div>
        </div>

        <!-- Sexo -->
        <div class="pt-2">

          <label class="block text-sm font-semibold text-gray-700 mb-1">
            Sexo
          </label>

          <div class="flex flex-col space-y-2 ml-2">

            <div class="flex items-center">
              <input
                id="sexo-m"
                type="radio"
                value="Masculino"
                formControlName="sexo"
                class="w-4 h-4">

              <label for="sexo-m" class="ml-2 text-sm font-medium text-gray-800">
                Masculino
              </label>
            </div>

            <div class="flex items-center">
              <input
                id="sexo-f"
                type="radio"
                value="Femenino"
                formControlName="sexo"
                class="w-4 h-4">

              <label for="sexo-f" class="ml-2 text-sm font-medium text-gray-800">
                Femenino
              </label>
            </div>

          </div>
        </div>

        <!-- Botones -->
        <div class="pt-4 space-y-3">

          <button
            type="submit"
            class="w-full text-black bg-white border-4 border-black hover:bg-gray-100 font-bold rounded-lg text-lg px-5 py-2.5 shadow">
           Imprimir
          </button>

          <button
          type="button"
          (click)="irARegistros()"
          class="w-full text-black bg-white border-4 border-black hover:bg-gray-100 font-bold rounded-lg text-lg px-5 py-2.5 shadow">
           Ver Registros
          </button>

          

        </div>

      </form>

    </div>

    <!-- RESULTADO -->
    <div class="pl-0 md:pl-6 pt-6 md:pt-0 flex flex-col items-center justify-center min-h-[350px]">

      <ng-container *ngIf="mostrar">

        <div class="text-center space-y-6">

          <h1 class="text-2xl font-normal text-gray-900">
            Hola
            <span class="font-bold italic">
              {{ zodiaco.nombre }}
              {{ zodiaco.Apaterno }}
              {{ zodiaco.Amaterno }}
            </span>
          </h1>

          <p class="text-xl text-gray-800">
            Tienes
            <span class="font-bold">
              {{ zodiaco.edad }}
            </span>
            años
          </p>
           <p class="text-xl text-gray-800">
            Tu sexo es 
            <span class="font-bold">
              {{ zodiaco.sexo }}
            </span>
          
          </p>

          <div class="space-y-4">

            <p class="text-xl text-gray-800">
              Tu signo zodiacal
            </p>

            <div class="flex items-center justify-center gap-4">

              <span class="text-xl font-medium text-gray-800">
                Es {{ zodiaco.signo }}
              </span>

              <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-blue-600 shadow-lg">

                <img
                  [src]="zodiaco.imagensigno"
                  [alt]="zodiaco.signo"
                  class="w-full h-full object-cover">

              </div>

            </div>

          </div>

        </div>

      </ng-container>

    </div>

  </div>

</div>
